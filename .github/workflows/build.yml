name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  # Fast leg: the platform-neutral core compiles and its tests pass on Linux. This is where the ADB
  # protocol, key encoding, framing, input mapping and geometry are verified.
  core:
    name: Core build and tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DexStream.sln

      - name: Build
        run: dotnet build DexStream.sln --configuration Release --no-restore

      - name: Test (Core)
        run: >-
          dotnet test tests/DexStream.Core.Tests/DexStream.Core.Tests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=core-tests.trx"
          --results-directory artifacts/test-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-results
          path: artifacts/test-results
          if-no-files-found: ignore

  # Full leg: everything, including the Windows-only USB, media and WPF projects, plus the packaged
  # outputs. This is the build that has to be green before a release.
  windows:
    name: Full build, tests and package (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DexStream.sln

      - name: Build
        run: dotnet build DexStream.sln --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test DexStream.sln --configuration Release --no-build
          --logger "trx;LogFileName=tests.trx"
          --results-directory artifacts/test-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results
          path: artifacts/test-results
          if-no-files-found: ignore

  # The device agent is plain javac plus d8, so it needs no Gradle. Two steps: a type-check against
  # the signature-only stubs, which needs nothing but a JDK and fails fast, then the real build
  # against the platform android.jar that produces the artifact shipped inside the host executable.
  agent:
    name: Device agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Type-check against the Android stubs
        run: agent/verify.sh

      - name: Build the agent jar
        run: agent/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dexstream-agent
          path: agent/build/dexstream-agent.jar
          if-no-files-found: error
