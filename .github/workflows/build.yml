name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  # Fast leg. Builds and tests everything that does not need the Windows Desktop SDK, which is where
  # the ADB protocol, key encoding, framing, input mapping and geometry are verified.
  core:
    name: Core build and tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DexStream.Linux.slnf

      - name: Build
        run: dotnet build DexStream.Linux.slnf --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test tests/DexStream.Core.Tests/DexStream.Core.Tests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=core-tests.trx"
          --results-directory artifacts/test-results

      # The WPF app cannot be built here (the Linux SDK omits the Windows Desktop SDK), but its C#
      # can still be type-checked against the WPF reference assemblies. Catches app-level mistakes in
      # this fast leg instead of only on Windows.
      - name: Type-check the app's C#
        run: >-
          dotnet build tools/DexStream.App.TypeCheck/DexStream.App.TypeCheck.csproj
          --configuration Release

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-results
          path: artifacts/test-results
          if-no-files-found: ignore

  # The device agent is plain javac plus d8, so it needs no Gradle. The stub type-check needs only a
  # JDK and fails fast; the real build produces the jar that gets embedded in the host executable.
  agent:
    name: Device agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Type-check against the Android stubs
        run: agent/verify.sh

      - name: Build the agent jar
        run: agent/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dexstream-agent
          path: agent/build/dexstream-agent.jar
          if-no-files-found: error

  # Authoritative leg: the whole solution including the WPF app, plus both shipping artifacts.
  windows:
    name: Full build, tests and package (Windows)
    runs-on: windows-latest

    # The app embeds the device agent so the portable executable is self-contained, which means the jar
    # has to exist before the app is built. Taking it from the agent job avoids needing the Android SDK
    # on the Windows runner as well.
    needs: agent

    steps:
      - uses: actions/checkout@v4

      - name: Fetch the device agent
        uses: actions/download-artifact@v4
        with:
          name: dexstream-agent
          path: agent/build

      - name: Confirm the agent will be embedded
        shell: pwsh
        run: |
          $jar = 'agent/build/dexstream-agent.jar'
          if (-not (Test-Path $jar)) {
            throw "$jar is missing, so the published executable would not contain the device agent."
          }
          "Agent present: {0:N0} bytes" -f (Get-Item $jar).Length

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DexStream.sln

      - name: Build
        run: dotnet build DexStream.sln --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test DexStream.sln --configuration Release --no-build
          --logger "trx;LogFileName=tests.trx"
          --results-directory artifacts/test-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results
          path: artifacts/test-results
          if-no-files-found: ignore

      # The portable deliverable: one self-contained .exe with no prerequisites.
      - name: Publish the portable executable
        run: >-
          dotnet publish src/DexStream.App/DexStream.App.csproj
          --configuration Release
          --output artifacts/portable

      - name: Report the portable size
        shell: pwsh
        run: |
          Get-ChildItem artifacts/portable -Filter *.exe |
            ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      # Runs the executable that is about to be uploaded. Compiling proves nothing about XAML resources,
      # bindings, text layout, globalization or the hosted swap-chain window; this executes all of them
      # on Windows, and fails the build rather than publishing an exe that cannot start. The app writes
      # its own log, which is printed either way so a failure explains itself.
      - name: Smoke-test the published executable
        shell: pwsh
        run: |
          $exe = (Resolve-Path artifacts/portable/DexStream.exe).Path
          $log = Join-Path $env:LOCALAPPDATA 'DexStream\dexstream.log'
          if (Test-Path $log) { Remove-Item $log }

          $startInfo = [System.Diagnostics.ProcessStartInfo]::new($exe, '--smoke-test')
          $startInfo.UseShellExecute = $false
          $process = [System.Diagnostics.Process]::Start($startInfo)
          $finished = $process.WaitForExit(120000)
          if (-not $finished) { $process.Kill() }

          New-Item -ItemType Directory -Force -Path artifacts/smoke | Out-Null
          if (Test-Path $log) {
            Copy-Item $log artifacts/smoke/dexstream.log
            Get-Content $log
          } else {
            'The app wrote no log at all, so it failed before logging was set up.'
          }

          if (-not $finished) { throw 'The app did not exit within 120 seconds.' }
          $meaning = @{ 1 = 'an unhandled exception'; 2 = 'the window never rendered'; 3 = 'the agent is not embedded' }
          if ($process.ExitCode -ne 0) {
            throw "Smoke test failed with exit code $($process.ExitCode): $($meaning[$process.ExitCode])."
          }
          'Smoke test passed: the published executable starts, renders and exits cleanly.'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-test-log
          path: artifacts/smoke
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: DexStream-portable
          path: artifacts/portable/DexStream.exe
          if-no-files-found: error

      # The installer deliverable. Per-user, so it needs no elevation to install.
      - name: Install the WiX tool
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build the installer
        shell: pwsh
        run: |
          $publishDir = (Resolve-Path artifacts/portable).Path + [IO.Path]::DirectorySeparatorChar
          New-Item -ItemType Directory -Force -Path artifacts/installer | Out-Null
          wix build installer/DexStream.wxs `
            -define "PublishDir=$publishDir" `
            -define "Version=0.1.0.0" `
            -out artifacts/installer/DexStream.msi

      - uses: actions/upload-artifact@v4
        with:
          name: DexStream-installer
          path: artifacts/installer/DexStream.msi
          if-no-files-found: error
